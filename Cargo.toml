[package]
name = "cohere-transcriber"
version = "0.1.0"
edition = "2021"
# src/mlx/weights.rs uses slice::as_chunks (stabilised in Rust 1.88).
rust-version = "1.88"
authors = ["Anthony Scotti"]
license = "Apache-2.0"
description = "Single-binary Cohere Transcribe ASR for Apple Silicon. Auto-downloads the model from Hugging Face, no Python or ffmpeg required."
readme = "README.md"
keywords = ["speech", "asr", "transcription", "mlx", "apple-silicon"]
categories = ["command-line-utilities"]

[[bin]]
name = "cohere-transcribe"
path = "src/main.rs"

[dependencies]
# Audio decoding (pure Rust: WAV, FLAC, MP3, AAC (ADTS + MP4/M4A), OGG Vorbis, ...)
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav", "isomp4"] }

# Audio resampling
rubato = "0.16"

# FFT for mel spectrogram computation
rustfft = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Hugging Face model download
hf-hub = "0.4"

[features]
# MLX backend: Apple Silicon GPU (Metal). This is the only backend on macOS.
default = ["mlx"]
mlx = []

[build-dependencies]
cmake = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
